name: Local Qwen Engineering Setup
version: 1.0.0
schema: v1
rules:
  - Antworte immer auf Deutsch, es sei denn explizit anders gewünscht.
  - Halte Antworten kurz und präzise.
  - Folge dem bestehenden Code-Stil.
  - Halluziniere keine APIs oder Dependencies.
models:
  - name: Mistral Chat
    provider: continue-proxy
    apiBase: http://127.0.0.1:8080/v1
    apiKey: none
    model: mistral
    roles:
      - chat
      - summarize
    defaultCompletionOptions:
      contextLength: 8192
      maxTokens: 2048
      temperature: 0.5
  - name: Qwen Agent
    provider: continue-proxy
    apiBase: http://127.0.0.1:8080/v1
    apiKey: none
    model: qwen
    roles:
      - edit
      - agent
    defaultCompletionOptions:
      contextLength: 8192
      maxTokens: 1024
      temperature: 0
mcpServers:
  - name: web-context
    type: sse
    url: http://127.0.0.1:8003/sse

# Proxy configuration required by Continue schema
proxy:
  type: continue-proxy
  orgScopeId: ""
  onPremProxyUrl: ""
